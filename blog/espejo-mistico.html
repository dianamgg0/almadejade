/* DESCARGAR */

// ============================================================
// DESCARGA DE LAS 3 TARJETAS
// ============================================================
function canvasABlob(canvas) {
    return new Promise((resolve, reject) => {

        canvas.toBlob(
            blob => {

                if (blob) {
                    resolve(blob);
                } else {
                    reject(
                        new Error(
                            "No se pudo convertir el canvas en Blob."
                        )
                    );
                }

            },
            "image/png"
        );

    });
}

function crearBaseTarjeta() {

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = 1080;
    canvas.height = 1350;

    // Fondo exterior
    ctx.fillStyle = "#e3cba8";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Tarjeta interior
    const margin = 45;
    const radius = 42;

    ctx.save();

    ctx.beginPath();
    ctx.roundRect(
        margin,
        margin,
        canvas.width - margin * 2,
        canvas.height - margin * 2,
        radius
    );

    ctx.fillStyle = "#f5ebd9";
    ctx.fill();

    ctx.strokeStyle = "rgba(114,94,82,0.35)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();

    return {
        canvas,
        ctx
    };
}


// ------------------------------------------------------------
// Cargar imagen
// ------------------------------------------------------------

function cargarImagen(src) {

    return new Promise(function(resolve, reject) {

        const img = new Image();

        img.onload = function() {
            resolve(img);
        };

        img.onerror = function() {
            reject(new Error("No se pudo cargar la imagen."));
        };

        img.src = src;

    });
}


// ------------------------------------------------------------
// Dibujar fotografía ovalada
// ------------------------------------------------------------

function dibujarFotoOvalada(
    ctx,
    user,
    imageX,
    imageY,
    imageW,
    imageH
) {

    ctx.save();

    ctx.beginPath();

    ctx.ellipse(
        imageX + imageW / 2,
        imageY + imageH / 2,
        imageW / 2,
        imageH / 2,
        0,
        0,
        Math.PI * 2
    );

    ctx.clip();

    const imgRatio = user.width / user.height;
    const boxRatio = imageW / imageH;

    let dw;
    let dh;
    let ox = 0;
    let oy = 0;

    if (imgRatio > boxRatio) {

        dh = imageH;
        dw = imageH * imgRatio;
        ox = (imageW - dw) / 2;

    } else {

        dw = imageW;
        dh = imageW / imgRatio;
        oy = (imageH - dh) / 2;

    }

    ctx.drawImage(
        user,
        imageX + ox,
        imageY + oy,
        dw,
        dh
    );

    ctx.restore();
}


// ------------------------------------------------------------
// Texto centrado con ajuste automático
// ------------------------------------------------------------

function dibujarTextoAjustado(
    ctx,
    texto,
    centroX,
    y,
    anchoMaximo,
    altoLinea,
    maxLineas
) {

    if (!texto) return;

    const palabras = texto.split(/\s+/);

    const lineas = [];

    let linea = "";

    palabras.forEach(function(palabra) {

        const prueba =
            linea === ""
                ? palabra
                : linea + " " + palabra;

        if (
            ctx.measureText(prueba).width > anchoMaximo &&
            linea !== ""
        ) {

            lineas.push(linea);
            linea = palabra;

        } else {

            linea = prueba;

        }

    });

    if (linea !== "") {
        lineas.push(linea);
    }

    const lineasFinales =
        lineas.slice(0, maxLineas);

    lineasFinales.forEach(function(linea, index) {

        ctx.fillText(
            linea,
            centroX,
            y + index * altoLinea
        );

    });

}


// ------------------------------------------------------------
// Pie de tarjeta
// ------------------------------------------------------------

function dibujarPieTarjeta(ctx) {

    ctx.save();

    ctx.textAlign = "center";

    ctx.fillStyle = "#725e52";

    ctx.font =
        '28px "Cormorant Garamond", serif';

    ctx.fillText(
        "— ✦ —",
        540,
        1115
    );

    ctx.font =
        'italic 32px "Cormorant Garamond", serif';

    ctx.fillStyle = "#635045";

    ctx.fillText(
        "Alma de Jade",
        540,
        1205
    );

    ctx.restore();
}


// ------------------------------------------------------------
// Tarjeta 1 — Arquetipo
// ------------------------------------------------------------

async function crearTarjetaArquetipo(user) {

    const base = crearBaseTarjeta();

    const canvas = base.canvas;
    const ctx = base.ctx;

    const imageW = 580;
    const imageH = 680;

    const imageX =
        (canvas.width - imageW) / 2;

    const imageY = 85;

    dibujarFotoOvalada(
        ctx,
        user,
        imageX,
        imageY,
        imageW,
        imageH
    );

    // Separador
    ctx.save();

    ctx.textAlign = "center";
    ctx.fillStyle = "#725e52";

    ctx.font =
        '28px "Cormorant Garamond", serif';

    ctx.fillText(
        "— ✦ —",
        540,
        805
    );

    // Arquetipo
    ctx.fillStyle = "#635045";

    ctx.font =
        'italic 58px "Cormorant Garamond", serif';

    ctx.fillText(
        arquetipoActual.nombre,
        540,
        865
    );

    // Descripción
    ctx.fillStyle = "#725e52";

    ctx.font =
        '30px "Cormorant Garamond", serif';

    dibujarTextoAjustado(
        ctx,
        descripcionTarjeta,
        540,
        925,
        800,
        42,
        5
    );

    ctx.restore();

    dibujarPieTarjeta(ctx);

    return canvas;
}


// ------------------------------------------------------------
// Tarjetas de interpretación
// ------------------------------------------------------------

async function crearTarjetaDimension(user, titulo, parrafo1, parrafo2) {

    const base = crearBaseTarjeta();
    const canvas = base.canvas;
    const ctx = base.ctx;

    const centroX = canvas.width / 2;


    // ------------------------------------------------
    // TÍTULO
    // ------------------------------------------------

    ctx.save();

    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#635045";
    ctx.font = 'italic 58px "Cormorant Garamond", serif';

    ctx.fillText(
        titulo,
        centroX,
        185
    );

    ctx.restore();


    // ------------------------------------------------
    // SEPARADOR SUPERIOR
    // ------------------------------------------------

    ctx.save();

    ctx.textAlign = "center";
    ctx.fillStyle = "#725e52";
    ctx.font = '28px "Cormorant Garamond", serif';

    ctx.fillText(
        "— ✦ —",
        centroX,
        270
    );

    ctx.restore();


    // ------------------------------------------------
    // TEXTO — PÁRRAFO 1
    // ------------------------------------------------

    ctx.save();

    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#725e52";
    ctx.font = '30px "Cormorant Garamond", serif';

    dibujarTextoAjustado(
        ctx,
        parrafo1,
        centroX,
        355,
        760,
        43,
        5
    );

    ctx.restore();


    // ------------------------------------------------
    // TEXTO — PÁRRAFO 2
    // ------------------------------------------------

    ctx.save();

    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#725e52";
    ctx.font = '30px "Cormorant Garamond", serif';

    dibujarTextoAjustado(
        ctx,
        parrafo2,
        centroX,
        625,
        760,
        43,
        5
    );

    ctx.restore();


    // ------------------------------------------------
    // FOTO OVALADA
    // ------------------------------------------------

    const imageW = 145;
    const imageH = 175;

    const imageX =
        centroX - imageW / 2;

    // El óvalo queda justo encima
    // del separador inferior.

    const imageY = 795;

    dibujarFotoOvalada(
        ctx,
        user,
        imageX,
        imageY,
        imageW,
        imageH
    );


    // ------------------------------------------------
    // SEPARADOR INFERIOR
    // ------------------------------------------------
    // Esta posición debe coincidir con
    // la del separador de la tarjeta Arquetipo.
    // ------------------------------------------------

    ctx.save();

    ctx.textAlign = "center";
    ctx.fillStyle = "#725e52";
    ctx.font = '28px "Cormorant Garamond", serif';

    ctx.fillText(
        "— ✦ —",
        centroX,
        1015
    );

    ctx.restore();


    // ------------------------------------------------
    // ALMA DE JADE
    // ------------------------------------------------

    ctx.save();

    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#635045";
    ctx.font = 'italic 32px "Cormorant Garamond", serif';

    ctx.fillText(
        "Alma de Jade",
        centroX,
        1195
    );

    ctx.restore();


    return canvas;
}

downloadCardBtn.addEventListener(
    "click",
    async function() {

            !uploadedImage ||
            !arquetipoActual ||
            !tarjetasActuales
        ) {
            return;

        const textoOriginal =

            // Esperar a que la fuente esté disponible
            if (document.fonts) {
                await document.fonts.ready;
            }

            const user =
                await cargarImagen(
                    uploadedImage.src
                );

            // ------------------------------------------------
            // Crear UNA SOLA colección desde la misma revelación
            // ------------------------------------------------

            const tarjetas = [];



// ------------------------------------------------
// 01 — ARQUETIPO
// ------------------------------------------------

tarjetas.push({
    nombre: "01-Arquetipo.png",
    canvas: await crearTarjetaArquetipo(user)
});


// ------------------------------------------------
// 02 — EXPRESIÓN
// ------------------------------------------------

const expresionParrafo1 =
    `${tarjetasActuales.esencia || ""} ${tarjetasActuales.mirada || ""}`.trim();

const expresionParrafo2 =
    `${tarjetasActuales.expresion || ""} ${tarjetasActuales.direccion || ""}`.trim();

tarjetas.push({
    nombre: "02-Expresion.png",
    canvas: await crearTarjetaDimension(
        user,
        "EXPRESIÓN",
        expresionParrafo1,
        expresionParrafo2
    )
});


// ------------------------------------------------
// 03 — ARMONÍA
// ------------------------------------------------

const armoniaParrafo1 =
    `${tarjetasActuales.matiz || ""} ${tarjetasActuales.equilibrio || ""}`.trim();

const armoniaParrafo2 =
    tarjetasActuales.cierre || "";

tarjetas.push({
    nombre: "03-Armonia.png",
    canvas: await crearTarjetaDimension(
        user,
        "ARMONÍA",
        armoniaParrafo1,
        armoniaParrafo2
    )
});
            // ------------------------------------------------
            // Crear ZIP
            // ------------------------------------------------

            const zip =
                new JSZip();

            const carpeta =
                zip.folder("Espejo-Mistico");

            for (
                const tarjeta of tarjetas
            ) {

                const blob =
                    await canvasABlob(
                        tarjeta.canvas
                    );

                carpeta.file(
                    tarjeta.nombre,
                    blob
                );

            }


            // ------------------------------------------------
            // Generar ZIP
            // ------------------------------------------------

            const zipBlob =
                await zip.generateAsync({
                    type: "blob",
                    compression: "DEFLATE",
                    compressionOptions: {
                        level: 6
                    }
                });


            // ------------------------------------------------
            // Descargar
            // ------------------------------------------------

            const url =
                URL.createObjectURL(zipBlob);

            const link =
                document.createElement("a");

            link.href = url;

            link.download =
                "Espejo-Mistico.zip";

            document.body.appendChild(link);

            link.click();

            link.remove();

            setTimeout(function() {
                URL.revokeObjectURL(url);
            }, 1000);


        } catch (error) {

            console.error(
                "Error al generar las tarjetas:",
                error
            );

            alert(
                "No pude preparar las tarjetas. Inténtalo nuevamente."
            );

        } finally {

            downloadCardBtn.disabled = false;

            downloadCardBtn.textContent =
                textoOriginal;

        }

    }
);
