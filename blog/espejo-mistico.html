 <main class="magic-mirror-page">  

   <section class="magic-mirror-section">
   
<h1>
Espejito, espejito... Místico<br>
          —  ✦ —
</h1>
<h2>
Dime... Cuál es mi revelación?
</h2>

<div class="mirror-frame" id="mirrorFrame">

  <img src="../images/Espejo.png" class="mirror-image">

  <div class="reflection">
    <img id="uploadedImage">
  </div>
<!-- Reconocimiento inicial -->
<div id="faceAnalysis" style="display:none;">

    <p id="analysisStatus">
        ✨ Observando tu reflejo...
    </p>

</div>
  
  <div class="light-rays"></div>

</div>

<div class="controls">

<input type="file" id="imageUpload" accept="image/*" hidden>
  
<p id="magicText">
    🍃 Tu reflejo revela tu divinidad 🍃
</p>
  
<button class="magic-btn" onclick="document.getElementById('imageUpload').click()">
📷 Sube tu imagen y descubre tu revelación
</button>

<button class="magic-btn" id="downloadBtn" style="display:none;">
🌼 Descargar mi revelación 🌼
</button>

</div>

<script>

const frases = [
"🏵️ Tu reflejo revela tu divinidad 🏵️",
"🪷 La luz que buscas vive en ti 🪷",
"☘️ Tu esencia ilumina el camino ☘️",
"🌻 Eres la magia que contemplas 🌻",
"🌹 Tu alma brilla sin límites 🌹",
"🪻 Dentro de ti habita el misterio 🪻",
"🌱 Tu luz interior despierta hoy 🌱",
"🌺 Eres reflejo de lo eterno 🌺",
"💮 La divinidad vive en tu mirada 💮",
"🌿 Tu espíritu resplandece 🌿"
];

let fraseActual = "";  
  
const upload = document.getElementById('imageUpload');
const uploadedImage = document.getElementById('uploadedImage');
const downloadBtn = document.getElementById('downloadBtn');
const magicText = document.getElementById('magicText');

/* SUBIR IMAGEN */

upload.addEventListener('change', function(e){

const file = e.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(event){

uploadedImage.src = event.target.result;

fraseActual = frases[Math.floor(Math.random() * frases.length)];

magicText.textContent = fraseActual;

magicText.style.display = "block";
downloadBtn.style.display = "inline-block";

 const faceAnalysis =
    document.getElementById("faceAnalysis");

const analysisStatus =
    document.getElementById("analysisStatus");

const mirrorFrame = document.getElementById("mirrorFrame");

faceAnalysis.style.display = "block";

analysisStatus.textContent =
    "✨ Observando tu reflejo..."; 
  
mirrorFrame.classList.add("analizando");

};


reader.readAsDataURL(file);

});

uploadedImage.onload = async function() {

    const resultado =
    await window.EspejoFacial.analizar(
        uploadedImage
    );
  mirrorFrame.classList.remove("analizando");

if (resultado) {

    const arquetipo =
        resultado.revelacion.arquetipo;

    const texto =
        resultado.revelacion.texto;


    analysisStatus.textContent =
        `${arquetipo.emoji} ${arquetipo.nombre}`;


    magicText.innerHTML =
        `<strong>${arquetipo.nombre}</strong><br><br>${texto}`;


    magicText.style.display =
        "block";


    fraseActual =
        `${arquetipo.emoji} ${arquetipo.nombre}\n\n${texto}`;


    console.log(
        "🌙 Arquetipo:",
        arquetipo
    );

    console.log(
        "✨ Dimensiones:",
        resultado.revelacion.dimensiones
    );

    console.log(
        "🌿 Revelación:",
        texto
    );


} else {

    analysisStatus.textContent =
        "No pude encontrar un rostro claro en la imagen.";

}

};

/* DESCARGAR */

downloadBtn.addEventListener('click', function(){

const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');

const frame = new Image();
frame.src = "../images/Espejo.png";

frame.onload = function(){

const ratio = frame.height / frame.width;

canvas.width = 1000;
canvas.height = 1000 * ratio;

ctx.fillStyle = "#e3d5c0";
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.drawImage(frame,0,0,canvas.width,canvas.height);

const user = new Image();
user.src = uploadedImage.src;

user.onload = function(){

const w = canvas.width * 0.64;
const h = canvas.height * 0.64;

const x = (canvas.width - w) / 2;
const y = canvas.height * 0.2;

ctx.save();

ctx.beginPath();

ctx.ellipse(
x + w/2,
y + h/2,
w/2,
h/2,
0,
0,
Math.PI * 2
);

ctx.clip();

/* cover */

const imgRatio = user.width / user.height;
const boxRatio = w / h;

let dw, dh, ox=0, oy=0;

if(imgRatio > boxRatio){
dh = h;
dw = h * imgRatio;
ox = (w - dw)/2;
}else{
dw = w;
dh = w / imgRatio;
oy = (h - dh)/2;
}

ctx.drawImage(user,x+ox,y+oy,dw,dh);

ctx.restore();

/* TEXTO REVELACION */

ctx.save();

ctx.font = "italic 60px 'Cormorant Garamond'";
ctx.textAlign = "center";
ctx.textBaseline = "bottom";

/* relleno dorado */
ctx.fillStyle = "#635045";

/* borde oscuro */


/* glow suave */
ctx.shadowColor = "rgba(0,0,0,0.45)";
ctx.shadowBlur = 18;
ctx.shadowOffsetX = 0;
ctx.shadowOffsetY = 2;

const text = fraseActual;
const xText = canvas.width / 2;
const yText = canvas.height - 25;

/* borde primero */
ctx.strokeText(text, xText, yText);

/* relleno encima */
ctx.fillText(text, xText, yText);

ctx.restore();

/* DESCARGA */

const link=document.createElement("a");
link.download="mi-revelacion.png";
link.href=canvas.toDataURL();
link.click();

};

};

});

</script>
